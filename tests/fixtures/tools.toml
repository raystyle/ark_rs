# 测试夹具：三种下载来源形态各一，字段契约见 docs/knowledge/references/R001
# 七类 taxonomy 各取样：python=runtime、vault=service、age=cli（节序即类序）
# age    = GitHub release + zip + 统一校验清单（sums_asset/sums_pattern）
# vault  = cdn_index_url（HashiCorp 式 index.json）
# python = GitHub release + version_pattern（版本从资产名提取）

[tools.python]
probe_pattern = 'Python (\d+\.\d+\.\d+)'
category = "runtime"
deploy = "envroot"
dir = "python"
bin = "python"
exe = 'python\python.exe'
extract = "targz"
repo = "astral-sh/python-build-standalone"
asset_pattern = 'cpython-.*-x86_64-pc-windows-msvc-install_only\.tar\.gz$'
version_pattern = 'cpython-([0-9.]+)\+'
tag = "20250818"
version = "3.12.11"
asset = "cpython-3.12.11+20250818-x86_64-pc-windows-msvc-install_only.tar.gz"
linux_dir = "python"
linux_bin = "python/bin"
linux_exe = "bin/python"
linux_extract = "targz-dir"
linux_tag = "20250818"
linux_version = "3.12.11"
linux_asset = "cpython-3.12.11+20250818-x86_64-unknown-linux-gnu-install_only.tar.gz"
linux_sha256 = "3333333333333333333333333333333333333333333333333333333333333333"
mac_dir = "python"
mac_bin = "python/bin"
mac_exe = "bin/python"
mac_extract = "targz-dir"
mac_tag = "20250818"
mac_version = "3.12.11"
mac_asset = "cpython-3.12.11+20250818-aarch64-apple-darwin-install_only.tar.gz"
mac_sha256 = "4444444444444444444444444444444444444444444444444444444444444444"

[tools.vault]
probe_pattern = 'Vault\s+v?(\d+\.\d+\.\d+)'
category = "service"
deploy = "envroot"
dir = "vault"
bin = "vault"
exe = 'vault\vault.exe'
extract = "zip"
cdn_index_url = "https://releases.hashicorp.com/vault/index.json"
cdn_asset_pattern = '^vault_{version}_windows_amd64\.zip$'
linux_cdn_asset_pattern = '^vault_{version}_linux_amd64\.zip$'
linux_dir = "vault"
linux_bin = "vault"
linux_exe = "vault"
linux_extract = "zip"
mac_cdn_asset_pattern = '^vault_{version}_darwin_arm64\.zip$'
mac_dir = "vault"
mac_bin = "vault"
mac_exe = "vault"
mac_extract = "zip"
tag = "1.20.2"
version = "1.20.2"
asset = "vault_1.20.2_windows_amd64.zip"
linux_tag = "1.20.2"
linux_version = "1.20.2"
linux_asset = "vault_1.20.2_linux_amd64.zip"
linux_sha256 = "1111111111111111111111111111111111111111111111111111111111111111"
mac_tag = "1.20.2"
mac_version = "1.20.2"
mac_asset = "vault_1.20.2_darwin_arm64.zip"
mac_sha256 = "2222222222222222222222222222222222222222222222222222222222222222"

[tools.age]
probe_pattern = '^v?(\d+\.\d+\.\d+)'
category = "cli"
deploy = "envroot"
dir = "age"
bin = "age"
exe = 'age\age.exe'
extract = "zip"
repo = "FiloSottile/age"
tag_prefix = "v"
asset_pattern = '^age-v[0-9.]+-windows-amd64\.zip$'
sums_asset = "age-{tag}-checksums.txt"
sums_pattern = 'windows-amd64\.zip'
linux_asset_pattern = '^age-v[0-9.]+-linux-amd64\.tar\.gz$'
# 测试布局用沙盒相对目录（非真实 ~/.local/bin）——posix exe 解析进沙盒，
# 避免 golden 探到真机已装工具（installed/path 随机器漂移，非确定）
linux_dir = "age"
linux_bin = "age"
linux_exe = "age"
linux_extract = "targz-bin"
linux_extra_bins = "age-keygen"
mac_asset_pattern = '^age-v[0-9.]+-darwin-arm64\.tar\.gz$'
mac_dir = "age"
mac_bin = "age"
mac_exe = "age"
mac_extract = "targz-bin"
mac_extra_bins = "age-keygen"
tag = "v1.3.1"
version = "1.3.1"
asset = "age-v1.3.1-windows-amd64.zip"
# pin 的 sha256 优先级最高（R001 四、2）
sha256 = "C56E8CE22F7E80CB85AD946CC82D198767B056366201D3E1A2B93D865BE38154"
linux_tag = "v1.3.1"
linux_version = "1.3.1"
linux_asset = "age-v1.3.1-linux-amd64.tar.gz"
linux_sha256 = "BDC69C09CBDD6CF8B1F333D372A1F58247B3A33146406333E30C0F26E8F51377"
mac_tag = "v1.3.1"
mac_version = "1.3.1"
mac_asset = "age-v1.3.1-darwin-arm64.tar.gz"
mac_sha256 = "01120EA2CBF0463D4C6BD767F99F3271BBED1CDC8A9AA718A76BA1FE4F01998B"
