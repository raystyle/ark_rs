# manifest.toml - 安装配置部署逻辑数据面样例（R016 B 层测试夹具，D39）。
# 真实数据权威在 ohmycloud catalog-seed（云端 ome/catalog/manifest.toml 三件套）；
# 本夹具供 catalog_lint 与 install 沙盒回归：demo 节的 post_install 仅验证 argv 执行链。
schema_version = 1

# pwsh/dotnet 遥测开关（自 install.rs 内建表迁移样例：数据面单方可配的实证形态）
[manifest.pwsh.env_set]
POWERSHELL_TELEMETRY_OPTOUT = "1"
POWERSHELL_UPDATECHECK = "Off"

[manifest.dotnet.env_set]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

# bun 别名（自 ensure_bunx_shim 硬编码迁移样例）
[manifest.bun.shims]
bunx = "bun"

# 受控命令样例（win 命令、linux/mac 显式 skip：三键齐备 lint 形态）
[manifest.demo.post_install]
win = [["cmd", "/c", "echo", "ark-manifest-ok"]]
skip = ["linux", "mac"]

# 镜像源节样例（D42，全集口径对齐 ohmypwsh set-mirror.ps1 / P0017；真实数据权威在
# ohmycloud catalog-seed，此为格式契约基准形态）。env 通道同 env_set：win 注册表、POSIX profile
# env 块（shell rc）；env_unset 撤旧通道变量防盖过文件配置。
[manifest.fnm.mirror]
npm_registry = "https://registry.npmmirror.com"

[manifest.fnm.mirror.env]
FNM_NODE_DIST_MIRROR = "https://npmmirror.com/mirrors/node/"

[manifest.uv.mirror]
uv_index = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
pip_index = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
env_unset = ["UV_INDEX_URL", "UV_DEFAULT_INDEX", "PIP_INDEX_URL", "PIP_TRUSTED_HOST"]

[manifest.uv.mirror.env]
UV_PYTHON_INSTALL_MIRROR = "https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone/"

[manifest.bun.mirror]
bunfig_registry = "https://registry.npmmirror.com/"

# go 代理语义键（D44 补位）：GOENV 文件行级 upsert 加配套 GOSUMDB
[manifest.go.mirror]
goproxy = "https://goproxy.cn,direct"

[manifest.go.mirror.env]
GOPROXY = "https://goproxy.cn,direct"
GO111MODULE = "on"
