[package]
name = "ark"
version = "1.2.3"
edition = "2021"
description = "Ark（Agent Runtime Kit）：全平台 Agent 工具及运行时依赖环境的部署、管理、验收与诊断 CLI"
license = "MIT"

[[bin]]
name = "ark"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order：结构化输出字段序与 kv 行序一致（默认 BTreeMap 会按字母序打乱）
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# D34：云端清单 minisign 签名校验（Ed25519，公钥内嵌）
minisign-verify = "0.2"
tar = "0.4"
toml_edit = { version = "0.22", features = ["serde"] }
ureq = { version = "2", features = ["tls"] }
which = "6"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件，只进测试构建
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
# dev-evo tool-rust 强制口径（ADR-0006 第五十九批）：lib 公开项契约注释全覆盖
missing_docs = "deny"

[lints.clippy]
# dev-evo 第六十批契约注释格式纪律：章节纪律 lint 面
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
