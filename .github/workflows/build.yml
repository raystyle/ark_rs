# ark dev 轻岗与测试门禁（REQ-0007 批二对齐 build-release 标准三段式）：
# - push main：构建测试后资产滚动挂 pre-release tag `dev`（本地测试期的滚动升级源，
#   `ark self update`）加 ark/dev 段 sync 灌段；dev 通道 CI 轻岗豁免（总台裁同 hst）。
# - 正式发布不在 CI：本地 .tools/release.ps1 编译打包直发（版本闸加冒烟加 gh 直发），
#   r2-seed workflow 于 release published 事件双段同灌（ark/<v>/ 加 ark/stable/）。
# 资产名即编译目标（selfupdate 按目标三元组映射）；mac 只要 arm64 不要 intel（用户裁决）。
name: build

on:
  push:
    branches:
      - main
    # docs-only 不触发构建与镜像灌段（win 构建非确定性白滚、路线 A 空转；2026-09-08 用户裁）。
    # v* tag 不再触发本工作流（批二撤正式构建岗，发布归本地 release.ps1）。workflow_dispatch 手动不受限。
    paths:
      - 'src/**'
      - 'tests/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # bin 随 crate 名（D41 A）；资产主名 ark-<target>。Windows 自 D46 切 gnu 交叉
          # （ubuntu 岗 mingw-w64 摆脱 VC，CRT 静态零 DLL 依赖）；msvc 历史资产的回退读序
          # 见 src/selfupdate.rs（asset_msvc_fallback，窗口期稳定版通道保供）。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ark
            asset: ark-x86_64-unknown-linux-gnu
            apt: liblzma-dev
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            bin: ark.exe
            asset: ark-x86_64-pc-windows-gnu.exe
            apt: mingw-w64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ark
            asset: ark-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 装系统依赖
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 测试
        # 交叉岗产物为 PE 不可在 linux 运行，跳过（测试面由 linux/mac 双岗覆盖，D46）；
        # 岗位代码与文档门禁在 linux/mac 岗等效覆盖。
        if: matrix.cross != true
        run: cargo test --release --locked --target ${{ matrix.target }}
        env:
          # 真网测试（query latest / jq 安装闭环）打 api.github.com：匿名共享 IP 限流 60 次/时，
          # 认证后 5000+（resolve.rs 读 GH_TOKEN 注入 Bearer，gh api 兜底同认它）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 文档门禁
        if: matrix.cross != true
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv run --script .tools/mdcharlint.py .
          uv run --script .tools/md-ref-scan.py
          uv run --script .tools/md-heading-scan.py
      - name: aidoc 投影门禁
        # 封版滚版本未再生成 aidoc 的漂移二犯（v1.2.3/v1.3.0），CI 挂门禁根治（2026-09-17 补审 F1）。
        # 只挂 linux 岗：投影与平台无关，省 mac 岗装时。
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-aidoc --version 0.4.0 --locked
          rustup toolchain install "$(cargo aidoc --print-required-toolchain)"
          cargo aidoc --check --strict
      - name: 归位资产名
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - name: 发布资产
        # dev 轻岗豁免面：仅滚动挂 dev prerelease（正式发布归本地 release.ps1，批二撤岗）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
        run: |
          # dev 滚动源：tag dev 不存在则从 main 建 prerelease
          gh release view dev --repo "$GITHUB_REPOSITORY" \
            || gh release create dev --repo "$GITHUB_REPOSITORY" \
                 --title dev --prerelease --target main
          gh release upload dev "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  mirror-r2:
    # D27/D41 路线 A（dev 轻岗豁免面）：main 推后资产灌 ark/dev 段（sync 形，seed.py）。
    # 正式双段（ark/<v>/ 加 ark/stable/）归 r2-seed workflow（release published 触发，
    # REQ-0007 批一）；stable_tag 补推口亦归 r2-seed dispatch。
    # ark/ 段配 ark-* 主名（ome/ 段与 ome-* 兼容名停写：全舰队 ome 水位清零，
    # 2026-09-14 用户裁定收口；桶内存量 ome/ 段对象由 ohmycloud 删）。资产过锚（本地 sha 自算）后
    # rclone 上传，NO_CHECK_BUCKET 必带（受限 token 无建桶权）。
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 装 rclone 与 uv 兜底（rclone pin v1.75.1，sha 锚即 catalog linux pin）
        run: |
          curl -fL -o rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip" | sha256sum -c -
          sudo unzip -j rclone.zip 'rclone-v1.75.1-linux-amd64/rclone' -d /usr/local/bin
          command -v rclone && rclone version | head -1
          command -v uv || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
          command -v uv || { echo uv 安装失败; exit 1; }
      - name: 灌段（main 推 ark/dev，sync 形）
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --script .tools/seed.py --ark-dev --tag dev
